<!doctype html>
<html lang="{{ page.lang | default: site.language | default: 'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5f3dc4" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="site-shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Home">
        <span class="brand-mark">JT</span>
        <span class="brand-text">
          <strong>Jake Taylor</strong>
          <small>Astrophysics at Oxford</small>
        </span>
      </a>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research/' %}class="active"{% endif %}>Research</a>
        <a href="{{ '/publications/' | relative_url }}" {% if page.url contains '/publications/' %}class="active"{% endif %}>Publications</a>
        <a href="{{ '/posts/' | relative_url }}" {% if page.url contains '/posts/' %}class="active"{% endif %}>Posts</a>
        <a href="{{ '/now-observing/' | relative_url }}" {% if page.url contains '/now-observing/' %}class="active"{% endif %}>Now Observing</a>
        <a href="{{ '/visibility/' | relative_url }}" {% if page.url contains '/visibility/' %}class="active"{% endif %}>Visibility</a>
        <a href="{{ '/supportme/' | relative_url }}" {% if page.url contains '/supportme/' %}class="active"{% endif %}>Support</a>
      </nav>
    </div>
  </header>

  <main id="content" class="site-shell page-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-shell footer-inner">
      <p>© {{ 'now' | date: '%Y' }} Jake Taylor</p>
      <p>
        <a href="https://www.physics.ox.ac.uk/our-people/jaketaylor" target="_blank" rel="noreferrer">Oxford Physics profile</a>
        <span aria-hidden="true">·</span>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <span aria-hidden="true">·</span>
        <a href="{{ '/research/' | relative_url }}">Research</a>
      </p>
    </div>
  </footer>
</body>
</html>
