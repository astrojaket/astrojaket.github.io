press:
  - outlet: NPR
    date: 25 April 2025
    title: New analysis casts doubt on ‘biosignatures’ found on planet K2-18b
    description: An interview about my independent, model-agnostic check of the JWST spectrum and why strong claims need strong evidence.
    link: https://www.npr.org/2025/04/25/g-s1-62610/biosignatures-k2-18b-james-webb-exoplanet-doubt

  - outlet: Smithsonian Magazine
    date: 30 April 2025
    title: A new analysis raises doubts about potential hints of life on a distant exoplanet
    description: Coverage of my K2-18b analysis and the wider scientific response to the claimed biosignature gases.
    link: https://www.smithsonianmag.com/smart-news/a-new-analysis-raises-doubts-about-potential-hints-of-life-recently-detected-on-a-distant-exoplanet-180986521/

  - outlet: Live Science
    date: 25 April 2025
    title: Did the James Webb telescope really find evidence of alien life?
    description: A detailed guide to K2-18b, the reported DMS signal and my finding that the MIRI spectrum has no strong spectral features.
    link: https://www.livescience.com/space/extraterrestrial-life/did-the-james-webb-telescope-really-find-evidence-of-alien-life-heres-the-truth-about-exoplanet-k2-18b

  - outlet: Space.com
    date: 1 May 2025
    title: Doubts over signs of alien life on exoplanet K2-18b are rising
    description: A report on how independent checks, including my analysis, form part of the scientific process around K2-18b.
    link: https://www.space.com/space-exploration/search-for-life/doubts-mount-further-over-signs-of-alien-life-on-k2-18b-this-is-evidence-of-the-scientific-process-at-work

  - outlet: Exeter College, Oxford
    date: 6 May 2025
    title: Exeter Supernumerary Fellow challenges claims of alien life on exoplanet K2-18b
    description: Exeter College profiles the analysis, its simple statistical approach and the need for caution when assessing biosignatures.
    link: https://www.exeter.ox.ac.uk/exeter-supernumerary-fellow-challenges-claims-of-alien-life-on-exoplanet-k2-18b/

